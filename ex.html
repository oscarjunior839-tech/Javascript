<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos em DOM</title>
    <style>
        body{
            background:linear-gradient(to right, yellow, #0072ff);
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
     <h1>site de multas</h1>
     velocidade: <input type="number" name="velocidade" id="velocidade" placeholder="Digite a velocidade">
     <input type="button" value="verificar" id="verificar" onclick="verificar()">
     <div id="resultado"></div>
</body>
<script>
function verificar(){
    var velocidade = document.getElementById("velocidade").value;
    var resultado = document.getElementById("resultado");
    var velocidade = parseFloat(velocidade);
      resultado.innerHTML = "Sua velocidade é: " + velocidade + " km/h. ";

    if(velocidade > 80){
        resultado.innerHTML = "Você foi multado!";
    }
    else{
        resultado.innerHTML = "Você está dentro do limite de velocidade.";
    }
}

</script>
</html>
