<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>somando numeros</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>somando valores</h1>
    <input type="number" name="textn1" id="textn1" placeholder="digite um numero">+
    <input type="number" name="textn2" id="textn2" placeholder="digite outro numero">
    <input type="button" value="somar" onclick="somar()">
    <div id="res">resultado</div>
</body>
<script>
    function somar() {

        var textn1 = document.getElementById("textn1");
        var textn2 = document.getElementById("textn2");
        var res=document.getElementById("res");
        var n1 = Number(textn1.value);
        var n2 = Number(textn2.value);
        var s = n1 + n2;
        res.innerText = `O resultado da soma é: ${s}`;
    }
</script>
</html>
