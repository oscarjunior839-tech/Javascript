<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos em DOM</title>
    <style>
        body{
             background-color: yellow;
             color: white;
             font-family: Arial, Helvetica, sans-serif;
             font: 16px;
        }
    </style>
</head>
<body>
    <h1> Aprendendo Primeiros passos em DOM</h1>
    <p> Aqui vai o resultado </p>
    <P>voce sabe disso</P>
    <div id="msg">clique em mim</div>
</body>
     <script>
        var n1=window.document.body;
        var p1=window.document.getElementsByTagName("p")[0];
        var msg=window.document.getElementById("msg");
           msg.style.backgroundColor="blue";
           msg.style.color="white";
           msg.innerText="estou aprendendo DOM";
           window.document.write(p1.innerHTML);
           p1.style.color="blue";
          n1.style.backgroundColor="black";
           var msg=window.document.querySelector("#msg");
           msg.style.color="blue";
      </script>
</html>
