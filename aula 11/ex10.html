<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=10">
    <title>detran</title>

</head>
<body>
    <h1>sites de multas</h1>
   Velocidade do carro: <input type="number" name="txtvel" id="txtvel">km/h

   <input type="button" value="verificar" onclick="calcular()">
   <div id="res"></div>

</body>
<script>
    function calcular() {

        var vel = document.getElementById('txtvel');
        var res = document.getElementById('res');
        var vel=Number(txtvel.value);
        
        res.innerHTML=`A velocidade do seu carro é ${vel} km/h`;
        if(vel>60){
            res.innerHTML+=`<p>Você ultrapassou a velocidade permitida<strong>MULTADO!</strong></p>`;
        }
        res.innerHTML+=`<p>Dirija sempre usando cinto de segurança!</p>`;
    }
</script>
</html>
